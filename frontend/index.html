<!DOCTYPE html>
<html lang="ko">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<div class="phone">

      <!-- use href="#star" x="254" y="213" width="60" height="60" class="neon-yellow"/-->
      </svg>
    </div>
    <div class="landing-inner">
      <div class="logo">
        <div class="wordmark">piu:m</div>
        <div class="tagline">컨셉 문구 한줄 </div>
        <div class="landing-divider"></div>
      </div>
      <div class="landing-fields">
        <div class="field-group">
          <label class="field-label">테이블 번호 선택</label>
          <button type="button" id="table-select-btn" class="field select-field-btn">테이블 번호 선택</button>
          <select id="table-select" class="field select-field" style="display:none;">
            <option value="" disabled selected>테이블 번호 선택</option>
          </select>
        </div>
        <div id="occupied-notice" class="occupied-notice">이미 참여중인 테이블이에요 · 닉네임만 입력하고 합류하세요</div>
        <div class="field-group">
          <label class="field-label" for="nickname-input">닉네임을 입력하세요</label>
          <input id="nickname-input" class="field" type="text" maxlength="8" placeholder="예: 오승준바보">
        </div>
        <div class="field-group">
          <label class="field-label">남자</label>
          <div id="male-row" class="stepper-row">
            <button type="button" class="step-btn" data-target="male" data-delta="-1">−</button>
            <span class="step-value" data-count="male">0</span>
            <button type="button" class="step-btn" data-target="male" data-delta="1">+</button>
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">여자</label>
          <div id="female-row" class="stepper-row">
            <button type="button" class="step-btn" data-target="female" data-delta="-1">−</button>
            <span class="step-value" data-count="female">0</span>
            <button type="button" class="step-btn" data-target="female" data-delta="1">+</button>
          </div>
        </div>
      </div>
      <button id="join-btn" class="btn-dark">참여하기</button>
      <div class="landing-footer">프리무스국제대학 피움 학생회</div>
    </div>
  </section>

  <!-- 좌석도 -->
  <section id="screen-seats" class="screen">
    <header class="topbar">
      <div class="wordmark small">piu:m</div>
      <div class="table-tag-block">
        <div id="table-tag" class="table-tag">TABLE -</div>
        <div id="table-tag-time" class="table-tag-time">00:00 이용중</div>
      </div>
    </header>

    <div class="stats-bar">
      <div class="stat-block">
        <span class="stat-mini-label">남</span>
        <span id="stat-male" class="stat-mini-num male">0</span>
      </div>
      <div class="stat-block">
        <span class="stat-mini-label">여</span>
        <span id="stat-female" class="stat-mini-num female">0</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-block col">
        <span class="stat-mini-label">이용 시간</span>
        <span id="stat-time" class="stat-mini-num">00:00</span>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-block col">
        <span class="stat-mini-label">받은 요청</span>
        <span id="stat-requests" class="stat-mini-num">0개</span>
      </div>
    </div>

    <div id="member-chips" class="member-chips"></div>

    <div id="seat-grid" class="seat-grid"></div>

    <footer class="bottombar">
      <button id="song-btn" class="pill-btn">신청곡 <span class="btn-arrow">›</span></button>
      <button id="history-btn" class="pill-btn">채팅 내역 <span id="history-badge" class="pill-badge">0</span><span class="btn-arrow">›</span></button>
    </footer>
  </section>

</div>

<!-- 채팅 요청 보내기 모달 -->
<div id="modal-send" class="modal-backdrop">
  <div class="modal-card">
    <button type="button" class="modal-close" data-modal="modal-send">×</button>
    <div id="send-seat-label" class="modal-title"></div>
    <textarea id="send-message" class="modal-textarea" placeholder="메시지를 입력하세요 (예: 안녕하세요! 같이 얘기해요 ㅎㅎ)"></textarea>
    <button id="send-request-btn" class="btn-dark full">요청</button>
  </div>
</div>

<!-- 채팅 요청 도착 모달 -->
<div id="modal-incoming" class="modal-backdrop">
  <div class="modal-card">
    <button type="button" id="incoming-close" class="modal-close">×</button>
    <div class="modal-title">!! 채팅 요청이 도착했습니다 !!</div>
    <div id="incoming-detail" class="modal-detail"></div>
    <div class="modal-row">
      <button id="accept-btn" class="btn-half accept">수락</button>
      <button id="reject-btn" class="btn-half reject">거절</button>
    </div>
  </div>
</div>

<!-- 신청곡 모달 -->
<div id="modal-song" class="modal-backdrop">
  <div class="modal-card">
    <button type="button" class="modal-close" data-modal="modal-song">×</button>
    <div class="modal-title">신청곡</div>
    <input id="song-input" class="modal-input" placeholder="듣고 싶은 곡을 입력하세요">
    <button id="song-submit-btn" class="btn-dark full">신청하기</button>
  </div>
</div>

<!-- 인원수 변경 모달 -->
<div id="modal-count" class="modal-backdrop">
  <div class="modal-card">
    <button type="button" class="modal-close" data-modal="modal-count">×</button>
    <div class="modal-title">인원수 변경</div>
    <div class="stepper-row">
      <span class="stepper-label">남자</span>
      <div class="stepper">
        <button type="button" class="step-btn" data-target="male" data-delta="-1">−</button>
        <span class="step-value" data-count="male">0</span>
        <button type="button" class="step-btn" data-target="male" data-delta="1">+</button>
      </div>
    </div>
    <div class="stepper-row" style="margin-top: 8px;">
      <span class="stepper-label">여자</span>
      <div class="stepper">
        <button type="button" class="step-btn" data-target="female" data-delta="-1">−</button>
        <span class="step-value" data-count="female">0</span>
        <button type="button" class="step-btn" data-target="female" data-delta="1">+</button>
      </div>
    </div>
    <button id="count-confirm-btn" class="btn-dark full">변경하기</button>
  </div>
</div>

<!-- 테이블 번호 선택 모달 -->
<div id="modal-table-select" class="modal-backdrop">
  <div class="modal-card">
    <button type="button" class="modal-close" data-modal="modal-table-select">×</button>
    <div class="modal-title">테이블 번호 선택</div>
    <div id="table-options" class="table-options-grid"></div>
  </div>
</div>

<!-- 닉네임 변경 모달 -->
<div id="modal-nickname" class="modal-backdrop">
  <div class="modal-card">
    <button type="button" class="modal-close" data-modal="modal-nickname">×</button>
    <div class="modal-title">닉네임 변경</div>
    <input id="nickname-edit-input" class="modal-input" maxlength="8" placeholder="새 닉네임을 입력하세요">
    <button id="nickname-confirm-btn" class="btn-dark full">변경하기</button>
  </div>
</div>

<!-- 채팅 내역 모달 (DM 목록) -->
<div id="modal-history" class="modal-backdrop">
  <div class="modal-card">
    <button type="button" class="modal-close" data-modal="modal-history">×</button>
    <div class="modal-title">채팅 내역</div>
    <div id="history-list" class="history-list"></div>
  </div>
</div>

<!-- 채팅창 모달 -->
<div id="modal-chat" class="modal-backdrop">
  <div class="modal-card chat-card">
    <button type="button" id="chat-close" class="modal-close">×</button>
    <div id="chat-title" class="modal-title"></div>
    <div id="chat-me-label" class="chat-me-label"></div>
    <div id="chat-log" class="chat-log"></div>
    <div class="chat-input-row">
      <input id="chat-input" class="modal-input" placeholder="메시지 입력">
      <button id="chat-send-btn" class="btn-dark">전송</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="script.js?v=10"></script>
</body>
</html>
