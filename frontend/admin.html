<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>piu:m admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="admin.css?v=6">
</head>
<body>
<section id="screen-login" class="screen active">
  <div class="login-card">
    <div class="login-logo">
      <div class="wordmark">PIU:M</div>
      <div class="tagline">ADMIN</div>
    </div>
    <input id="admin-id" class="field" type="text" placeholder="관리자 ID">
    <input id="admin-pw" class="field" type="password" placeholder="비밀번호">
    <button id="login-btn" class="btn-dark full">로그인</button>
  </div>
</section>

<section id="screen-admin" class="screen">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="wordmark small">PIU:M</div>
      <div class="tagline">ADMIN</div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-btn active" data-tab="tables">테이블 현황</button>
      <button class="nav-btn" data-tab="games">게임 관리</button>
      <button class="nav-btn" data-tab="songs">신청곡 <span id="song-nav-badge" class="nav-badge" data-zero="true">0</span></button>
      <button class="nav-btn" data-tab="notices">공지</button>
    </nav>
    <button id="logout-btn" class="logout-btn">로그아웃</button>
  </aside>

  <main class="main-area">
    <header class="admin-topbar">
      <div class="stat-chip"><span class="stat-label">사용 중 테이블</span><span id="stat-occupied" class="stat-value">0/0</span></div>
      <div class="stat-chip"><span class="stat-label">총 인원</span><span id="stat-people" class="stat-value">0명</span></div>
      <div class="stat-chip"><span class="stat-label">선택 게임</span><span id="stat-game" class="stat-value">MISSION</span></div>
    </header>

    <div id="tab-tables" class="tab-panel active">
      <div id="table-grid" class="table-grid"></div>
    </div>

    <div id="tab-games" class="tab-panel">
      <div class="game-panel">
        <h3 class="panel-title">게임 선택</h3>
        <div id="game-list" class="game-list"></div>
        <button id="broadcast-btn" class="btn-dark full">전체 게임 시작</button>
        <h3 class="panel-title" style="margin-top:24px;">실행 기록</h3>
        <div id="game-log" class="game-log">
          <div class="game-log-empty">아직 실행한 게임이 없습니다.</div>
        </div>
      </div>
    </div>

    <div id="tab-songs" class="tab-panel">
      <div class="game-panel" style="max-width:620px;">
        <h3 class="panel-title">받은 신청곡</h3>
        <div id="song-request-list" class="song-list"></div>
      </div>
    </div>

    <div id="tab-notices" class="tab-panel">
      <div class="game-panel" style="max-width:620px;">
        <h3 class="panel-title">공지 작성</h3>
        <input id="notice-title" class="field" placeholder="제목">
        <textarea id="notice-content" class="field" rows="5" style="margin-top:10px;resize:vertical;" placeholder="내용"></textarea>
        <select id="notice-category" class="field" style="margin-top:10px;">
          <option value="GENERAL">GENERAL</option>
          <option value="GAME">GAME</option>
          <option value="EVENT">EVENT</option>
          <option value="OPERATION">OPERATION</option>
        </select>
        <button id="notice-send-btn" class="btn-dark full" style="margin-top:10px;">공지 전송</button>
      </div>
    </div>
  </main>
</section>

<div id="detail-overlay" class="detail-overlay"></div>
<div id="detail-panel" class="detail-panel">
  <div class="detail-header">
    <div id="detail-title" class="detail-title">TABLE -</div>
    <button id="detail-close" class="modal-close">×</button>
  </div>
  <div id="detail-body" class="detail-body"></div>
</div>

<div id="admin-toast" class="toast"></div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script type="module" src="js/admin-app.js?v=1"></script>
</body>
</html>
