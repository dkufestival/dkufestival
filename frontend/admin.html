<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>piu:m admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="admin.css?v=5">
</head>
<body>

<!-- 로그인 화면 -->
<section id="screen-login" class="screen active">
  <div class="login-card">
    <div class="login-logo">
      <div class="wordmark">PIU:M</div>
      <div class="tagline">ADMIN</div>
    </div>
    <input id="admin-id" class="field" type="text" placeholder="관리자 ID (데모: admin)">
    <input id="admin-pw" class="field" type="password" placeholder="비밀번호 (데모: 1234)">
    <button id="login-btn" class="btn-dark full">로그인</button>
  </div>
</section>

<!-- 관리자 대시보드 -->
<section id="screen-admin" class="screen">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="wordmark small">PIU:M</div>
      <div class="tagline">ADMIN</div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-btn active" data-tab="tables">테이블 현황</button>
      <button class="nav-btn" data-tab="games">게임 관리</button>
      <button class="nav-btn" data-tab="songs">신청곡 <span id="song-nav-badge" class="nav-badge" data-zero="true">0</span></button>
    </nav>
    <button id="logout-btn" class="logout-btn">로그아웃</button>
  </aside>

  <main class="main-area">
    <header class="admin-topbar">
      <div class="stat-chip">
        <span class="stat-label">사용중 테이블</span>
        <span id="stat-occupied" class="stat-value">0/10</span>
      </div>
      <div class="stat-chip">
        <span class="stat-label">총 인원</span>
        <span id="stat-people" class="stat-value">0명</span>
      </div>
      <div class="stat-chip">
        <span class="stat-label">게임 상태</span>
        <span id="stat-game" class="stat-value">대기중</span>
      </div>
    </header>

    <!-- 테이블 현황 탭 -->
    <div id="tab-tables" class="tab-panel active">
      <div id="table-grid" class="table-grid"></div>
    </div>

    <!-- 게임 관리 탭 -->
    <div id="tab-games" class="tab-panel">
      <div class="game-panel">
        <h3 class="panel-title">게임 선택</h3>
        <div id="game-list" class="game-list"></div>

        <button id="broadcast-btn" class="btn-dark full">지금 전체 방송하기</button>

        <label class="toggle-row">
          <input type="checkbox" id="auto-toggle">
          <span>매시 정각 자동 시작</span>
        </label>

        <h3 class="panel-title" style="margin-top:24px;">실행 기록</h3>
        <div id="game-log" class="game-log">
          <div class="game-log-empty">아직 실행한 게임이 없어요</div>
        </div>
      </div>
    </div>

    <!-- 신청곡 탭 -->
    <div id="tab-songs" class="tab-panel">
      <div class="game-panel" style="max-width: 560px;">
        <h3 class="panel-title">받은 신청곡</h3>
        <div id="song-request-list" class="song-list"></div>
      </div>
    </div>
  </main>
</section>

<!-- 테이블 상세 패널 -->
<div id="detail-overlay" class="detail-overlay"></div>
<div id="detail-panel" class="detail-panel">
  <div class="detail-header">
    <div id="detail-title" class="detail-title">TABLE -</div>
    <button id="detail-close" class="modal-close">×</button>
  </div>
  <div id="detail-body" class="detail-body"></div>
</div>

<div id="admin-toast" class="toast"></div>

<script src="admin.js?v=5"></script>
</body>
</html>
