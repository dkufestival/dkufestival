<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>핀볼 레이스</title>
  <link rel="stylesheet" href="pinball.css?v=2">
</head>
<body>
  <main>
    <header><strong>PINBALL RACE</strong><span id="status">구슬 준비 중</span></header>
    <canvas id="board"></canvas>
    <ol id="ranking"></ol>
    <section id="winner-popup" class="winner-popup" role="status" aria-live="assertive" hidden>
      <div class="winner-card">
        <span class="winner-kicker">PINBALL WINNER</span>
        <strong id="winner-name"></strong>
        <p>1등으로 도착했습니다!</p>
      </div>
    </section>
    <aside id="editor" hidden>
      <strong>맵 편집기</strong>
      <div class="editor-tools">
        <button data-tool="select" class="active">선택/이동</button>
        <button data-tool="peg">점 추가</button>
        <button data-tool="bumper">범퍼 추가</button>
        <button data-tool="spinner">회전대 추가</button>
        <button data-tool="rail">레일 추가</button>
      </div>
      <label>맵 위치 <input id="editor-scroll" type="range" min="0" max="1850" value="0"></label>
      <div class="editor-actions">
        <button id="editor-delete">선택 삭제</button>
        <button id="editor-save">저장</button>
        <button id="editor-copy">JSON 복사</button>
        <button id="editor-reset">초기화</button>
      </div>
      <small id="editor-help">장애물을 선택한 뒤 드래그해서 이동하세요.</small>
    </aside>
  </main>
  <script type="module" src="pinball.js?v=13"></script>
</body>
</html>
